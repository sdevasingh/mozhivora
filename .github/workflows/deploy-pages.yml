name: Deploy MOZHIVORA to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_marketing/package-lock.json

      - name: Build Astro Marketing Site
        working-directory: web_marketing
        run: |
          npm ci
          npm run build

      - name: Build Flutter Web App (/app/)
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/app/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Combine Marketing Site + Flutter App into _site
        run: |
          mkdir -p _site/app
          cp -r web_marketing/dist/* _site/
          cp -r build/web/* _site/app/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
